paths:
  source: source
  transcripts: transcripts
  alignments: alignments
  indexes: indexes
  reports: reports
  cache: cache
  models: models
  temp: temp

processing:
  retries: 3
  backoff_seconds: 2
  overwrite: false

whisper:
  model_size: base
  language: sw
  batch_size: 8
  compute_type: float32

alignment:
