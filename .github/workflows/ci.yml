name: CI

on:
  pull_request:
    branches:
      - main
      - staging
  push:
    branches:
      - main
      - staging
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build and validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: supabase-connect-main

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: supabase-connect-main/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx --no-install playwright install --with-deps chromium

      - name: TypeScript
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

      - name: Full test suite
        run: npm test -- --no-file-parallelism --reporter=dot

      - name: Production build
        run: npm run build

      - name: Repository sanity check
        shell: bash
        run: |
          git diff --check
          test -z "$(git status --porcelain)"

      - name: Record validation provenance
        if: always()
        working-directory: .
        shell: bash
        run: |
          {
            echo "### CI validation provenance"
            echo "- Commit SHA: \`${GITHUB_SHA}\`"
            echo "- Node: \`$(node --version)\`"
            echo "- npm: \`$(npm --version)\`"
            echo "- Package manager: npm (package-lock.json)"
            echo "- Required job: Build and validate"
          } >> "$GITHUB_STEP_SUMMARY"
