name: CI

on:
  pull_request:
    branches:
      - main
      - staging
  push:
    branches:
      - staging

permissions:
  contents: read

jobs:
  build:
    name: Build and validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase-connect-main

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: supabase-connect-main/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Detect TypeScript validation script
        id: typecheck
        shell: bash
        run: |
          if node -e "const scripts = require('./package.json').scripts || {}; process.exit(scripts.typecheck ? 0 : 1)"; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run TypeScript validation
        if: steps.typecheck.outputs.available == 'true'
        run: npm run typecheck

      - name: Build application
        run: npm run build
